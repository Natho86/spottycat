[pytest]
# pytest configuration for spottycat

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-config
    --strict-markers
    --disable-warnings
    --cov=spottycat
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --junit-xml=pytest-results.xml

# Minimum version
minversion = 7.0

# Test markers
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that may require AWS services
    slow: Tests that take a long time to run
    aws: Tests that interact with AWS services (require credentials)
    mock: Tests that use mocked AWS services
    cli: Tests for CLI interface
    config: Tests for configuration management
    cost: Tests for cost calculation functionality
    security: Tests for security-related functionality
    
# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    
# Environment variables for testing
env =
    SPOTTYCAT_TEST_MODE = true
    AWS_DEFAULT_REGION = us-east-1 